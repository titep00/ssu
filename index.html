<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>세트위드 | 드라마 현장 세팅 워크스페이스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a href="#dashboard" class="brand"><span class="brand-mark">✦</span><span>SETWITH<small>production workspace</small></span></a>
      <div class="project-picker"><span class="mini-label">현재 프로젝트</span><select id="project-select"></select><button data-action="new-project">＋ 새 프로젝트</button></div>
      <nav class="side-nav"><span class="nav-label">WORKSPACE</span><button class="active" data-view="dashboard">▦ <span>오늘 / 대시보드</span></button><button data-view="scenes">▤ <span>회차·씬</span><i id="scene-count">0</i></button><button data-view="set">⌗ <span>공간 세팅</span></button><button data-view="props">◈ <span>소품 라이브러리</span></button><button data-view="prep">✓ <span>소품 준비함</span><i id="prep-count">0</i></button><span class="nav-label second">ON SET</span><button data-view="field">◉ <span>현장 모드</span></button><button data-view="records">▧ <span>촬영 기록</span></button></nav>
      <div class="sidebar-foot"><button data-action="export">⇩ 데이터 백업</button><small>브라우저에 자동 저장됩니다</small></div>
    </aside>

    <div class="main-shell">
      <header class="topbar"><button class="mobile-nav" data-action="toggle-sidebar">☰</button><div><span class="top-kicker" id="top-project">DRAMA PROJECT</span><h1 id="view-title">오늘 촬영</h1></div><div class="top-actions"><label class="quick-search">⌕ <input id="quick-search" placeholder="씬·소품 빠른 검색" /></label><button class="round-button" data-action="toggle-theme">◐</button><button class="round-button" data-action="toggle-sidebar">☰</button></div></header>
      <main id="app-content"></main>
    </div>
  </div>
  <div id="modal-root"></div><div id="toast" class="toast"></div>
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="script.js"></script>
</body>
</html>
